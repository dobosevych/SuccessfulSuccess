AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Sign-in for the meetings app: a Cognito user pool where people sign up with
  their email and a password, optionally federated with Google, plus the public
  app client the Next.js frontend signs in through. The backend accepts the
  access tokens this pool issues to that client.

Parameters:
  ProjectName:
    Type: String
    Default: successfulsuccess
    Description: Prefix for the names of the resources in this stack.

  DomainPrefix:
    Type: String
    Default: ""
    Description: >-
      Prefix for Cognito UserPoolDomain. If empty, defaults to ${ProjectName}-${AWS::AccountId}.

  AppUrls:
    Type: CommaDelimitedList
    Default: "http://localhost:3000/,http://localhost:3000/auth/callback/"
    Description: >-
      Every URL the site is served from, each ending in "/": Cognito sends
      people back there after signing in with Google or signing out. Include
      the local dev server and the CloudFront site.

  GoogleClientId:
    Type: String
    Default: ""
    Description: >-
      OAuth client id of a Google Cloud "Web application" client. Empty leaves
      Google sign-in out; email and password still work.

  GoogleClientSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: That Google client's secret.

Conditions:
  HasGoogle: !Not [!Equals [!Ref GoogleClientId, ""]]
  HasDomainPrefix: !Not [!Equals [!Ref DomainPrefix, ""]]

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${ProjectName}-users"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      UserPoolTier: ESSENTIALS
      UsernameConfiguration:
        CaseSensitive: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      UserPoolTags:
        PROJECT_NAME: demo

  # Hosts the OAuth endpoints:
  # https://<prefix>.auth.<region>.amazoncognito.com
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !If [HasDomainPrefix, !Ref DomainPrefix, !Sub "${ProjectName}-${AWS::AccountId}"]
      ManagedLoginVersion: 2

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasGoogle
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: openid email profile
      AttributeMapping:
        email: email
        email_verified: email_verified
        name: name

  # Public client for the browser: no secret, SRP for passwords,
  # and authorization-code flow with PKCE.
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn:
      - UserPoolDomain
      - GoogleIdentityProvider
    Properties:
      ClientName: !Sub "${ProjectName}-web"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      SupportedIdentityProviders:
        - COGNITO
        - Google
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs: !Ref AppUrls
      LogoutURLs: !Ref AppUrls

  ManagedLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn:
      - UserPoolDomain
      - UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref UserPoolClient
      UseCognitoProvidedValues: true

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  DomainPrefix:
    Value: !If [HasDomainPrefix, !Ref DomainPrefix, !Sub "${ProjectName}-${AWS::AccountId}"]
  Issuer:
    Description: The "iss" of every token; its signing keys are at <Issuer>/.well-known/jwks.json
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
  HostedDomain:
    Description: Cognito's OAuth domain, which the frontend sends Google sign-in through
    Value: !Sub "${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
  GoogleRedirectUri:
    Description: Add this to the Google client's "Authorized redirect URIs"
    Value: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com/oauth2/idpresponse"
  GoogleEnabled:
    Value: !If [HasGoogle, "true", "false"]
