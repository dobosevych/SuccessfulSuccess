AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Meetings backend on AWS: a Lambda function (container image) behind its own
  function URL, talking to a private Aurora Serverless v2 PostgreSQL cluster
  that pauses (scales to zero) when idle. The same function applies the
  migrations when invoked directly.

Parameters:
  ProjectName:
    Type: String
    Default: successfulsuccess
    Description: Prefix for the names of the resources in this stack.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to deploy into (the account's default VPC works).

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >-
      At least two subnets in different availability zones: Aurora needs two
      for its subnet group, and the function attaches to the same ones. It only
      ever talks to the database, so it needs no NAT gateway.

  ImageUri:
    Type: String
    Description: >-
      Backend image, pinned by digest so every push changes the template:
      <account>.dkr.ecr.<region>.amazonaws.com/<repo>@sha256:...

  Architecture:
    Type: String
    Default: x86_64
    AllowedValues: [x86_64, arm64]
    Description: >-
      Must match the platform the image was built for. arm64 Lambda is ~20%
      cheaper and builds natively on Apple Silicon.

  MemorySize:
    Type: Number
    Default: 512
    MinValue: 128
    MaxValue: 10240
    Description: API function memory in MB; CPU scales with it.

  MaxConcurrency:
    Type: Number
    Default: 0
    MinValue: 0
    Description: >-
      Reserved concurrency: the most function instances running at once. Each
      warm instance holds one database connection. 0 reserves nothing, leaving
      the account's own limit as the cap; new accounts get 10 in total, and
      Lambda refuses any reservation that leaves fewer than 10 unreserved.
      Raise it once the account's limit has been increased.

  DbEngineVersion:
    Type: String
    Default: ""
    Description: >-
      Aurora PostgreSQL version. Empty uses the region's current default, which
      supports pausing at 0 ACU (that needs 13.15+, 14.12+, 15.7+ or 16.3+).

  DbMinCapacity:
    Type: Number
    Default: 0
    MinValue: 0
    Description: >-
      Lowest Aurora capacity in ACUs. 0 lets the cluster pause when idle, so it
      bills only for storage until the next connection wakes it (~15 s).

  DbMaxCapacity:
    Type: Number
    Default: 1
    MinValue: 1
    Description: >-
      Highest Aurora capacity in ACUs (1 ACU ~ 2 GB of memory). 1 is the
      smallest Aurora allows, and plenty for this app.

  DbAutoPauseSeconds:
    Type: Number
    Default: 300
    MinValue: 300
    MaxValue: 86400
    Description: Idle seconds before a cluster with DbMinCapacity 0 pauses.

  DbName:
    Type: String
    Default: meetings

  DbUsername:
    Type: String
    Default: app

  DbPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    MaxLength: 41
    AllowedPattern: "[a-zA-Z0-9_-]+"
    Description: >-
      Master password. Letters, digits, underscore and dash only: it is embedded
      in a connection URL, where other characters would need escaping.

  AppTimezone:
    Type: String
    Default: Europe/Kyiv

  CorsOrigins:
    Type: String
    Default: "*"
    Description: Comma-separated origins allowed to call the API.

  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [DEBUG, INFO, WARNING, ERROR]

  CognitoUserPoolId:
    Type: String
    Description: User pool whose access tokens the API accepts (the auth stack's UserPoolId).

  CognitoClientId:
    Type: String
    Description: The app client those tokens must be issued to (the auth stack's UserPoolClientId).

  CognitoJwks:
    Type: String
    Description: >-
      The pool's public signing keys (its jwks.json), base64-encoded. The
      function has no internet access to fetch them itself; `make
      aws-deploy-backend` downloads them.

Conditions:
  HasDbEngineVersion: !Not [!Equals [!Ref DbEngineVersion, ""]]
  HasMaxConcurrency: !Not [!Equals [!Ref MaxConcurrency, 0]]

Resources:
  # --- networking -----------------------------------------------------------

  FunctionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} backend function"
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-function"
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} database"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref FunctionSecurityGroup
          Description: Function to PostgreSQL
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-db"
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # --- database -------------------------------------------------------------

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${ProjectName} database subnets"
      SubnetIds: !Ref SubnetIds
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  DbCluster:
    Type: AWS::RDS::DBCluster
    # A demo stack: `make aws-destroy` should leave nothing billable behind.
    # The default (Snapshot) would keep charging for snapshot storage.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBClusterIdentifier: !Sub "${ProjectName}-db"
      Engine: aurora-postgresql
      EngineVersion: !If [HasDbEngineVersion, !Ref DbEngineVersion, !Ref "AWS::NoValue"]
      DatabaseName: !Ref DbName
      MasterUsername: !Ref DbUsername
      MasterUserPassword: !Ref DbPassword
      DBSubnetGroupName: !Ref DbSubnetGroup
      VpcSecurityGroupIds:
        - !Ref DbSecurityGroup
      StorageEncrypted: true
      BackupRetentionPeriod: 1        # Aurora's minimum; the continuous backup is free up to the cluster size
      DeletionProtection: false
      ServerlessV2ScalingConfiguration:
        MinCapacity: !Ref DbMinCapacity
        MaxCapacity: !Ref DbMaxCapacity
        SecondsUntilAutoPause: !Ref DbAutoPauseSeconds
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # Serverless v2 capacity lives on instances; one writer is enough here.
  DbInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub "${ProjectName}-db-1"
      DBClusterIdentifier: !Ref DbCluster
      Engine: aurora-postgresql
      DBInstanceClass: db.serverless
      PubliclyAccessible: false
      AutoMinorVersionUpgrade: true
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # --- function -------------------------------------------------------------

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Write logs, and manage the network interfaces a VPC function needs.
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-backend"
      RetentionInDays: 7
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ApiFunction:
    Type: AWS::Lambda::Function
    # Migrations run right after the stack settles, so the writer must exist.
    DependsOn: DbInstance
    Properties:
      FunctionName: !Sub "${ProjectName}-backend"
      Description: Meetings API (FastAPI through Mangum)
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Architectures:
        - !Ref Architecture
      Role: !GetAtt FunctionRole.Arn
      MemorySize: !Ref MemorySize
      ReservedConcurrentExecutions: !If [HasMaxConcurrency, !Ref MaxConcurrency, !Ref "AWS::NoValue"]
      # A paused cluster takes ~15 s to resume on the first connection, so
      # leave room for that on top of the request itself.
      Timeout: 60
      LoggingConfig:
        LogGroup: !Ref LogGroup
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds:
          - !Ref FunctionSecurityGroup
      Environment:
        Variables:
          # NOTE: the password ends up readable in the function configuration.
          # Moving it to SSM Parameter Store is the first thing to harden here.
          DATABASE_URL: !Sub
            - "postgresql+asyncpg://${DbUsername}:${DbPassword}@${Endpoint}:${Port}/${DbName}"
            - Endpoint: !GetAtt DbCluster.Endpoint.Address
              Port: !GetAtt DbCluster.Endpoint.Port
          APP_TIMEZONE: !Ref AppTimezone
          CORS_ORIGINS: !Ref CorsOrigins
          LOG_LEVEL: !Ref LogLevel
          COGNITO_REGION: !Ref AWS::Region
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          COGNITO_JWKS: !Ref CognitoJwks
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # --- function URL ---------------------------------------------------------

  # The function's own HTTPS endpoint (https://<id>.lambda-url.<region>.on.aws).
  # Public: FastAPI itself checks the Cognito access token on every meetings
  # request (the function URL cannot validate Cognito tokens). CORS stays in FastAPI;
  # configuring it here too would override the app's headers. The URL and the
  # permissions below take no tags.
  FunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt ApiFunction.Arn
      AuthType: NONE
      InvokeMode: BUFFERED

  # A public URL needs both statements: InvokeFunctionUrl for the URL itself,
  # and InvokeFunction limited to calls that arrive through it.
  FunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  FunctionUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  ApiUrl:
    Description: Base URL of the backend (the function URL, without its trailing slash)
    Value: !Sub ["https://${Host}", {Host: !Select [2, !Split ["/", !GetAtt FunctionUrl.FunctionUrl]]}]
  HealthUrl:
    Description: Health check
    Value: !Sub ["https://${Host}/health", {Host: !Select [2, !Split ["/", !GetAtt FunctionUrl.FunctionUrl]]}]
  DocsUrl:
    Description: Swagger UI
    Value: !Sub ["https://${Host}/docs", {Host: !Select [2, !Split ["/", !GetAtt FunctionUrl.FunctionUrl]]}]
  FunctionUrlDomain:
    Description: The function URL's host name
    Value: !Select [2, !Split ["/", !GetAtt FunctionUrl.FunctionUrl]]
  DatabaseEndpoint:
    Description: Aurora cluster (writer) endpoint, private to the VPC
    Value: !GetAtt DbCluster.Endpoint.Address
  FunctionName:
    Value: !Ref ApiFunction
  LogGroupName:
    Value: !Ref LogGroup
